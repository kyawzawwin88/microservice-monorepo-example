services:
  # ============================================
  # Shared Infrastructure
  # ============================================
  mysql-sales:
    image: mysql:8.0
    container_name: mysql-sales
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: sales_db
    ports:
      - "3310:3306"
    volumes:
      - sales_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-psecret"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - microservice-net

  mysql-invoice:
    image: mysql:8.0
    container_name: mysql-invoice
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: invoice_db
    ports:
      - "3311:3306"
    volumes:
      - invoice_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-psecret"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - microservice-net

  mysql-payment:
    image: mysql:8.0
    container_name: mysql-payment
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: payment_db
    ports:
      - "3312:3306"
    volumes:
      - payment_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-psecret"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - microservice-net

  mysql-inventory:
    image: mysql:8.0
    container_name: mysql-inventory
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: inventory_db
    ports:
      - "3313:3306"
    volumes:
      - inventory_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-psecret"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - microservice-net

  # Shared event bus database for cross-service communication
  mysql-eventbus:
    image: mysql:8.0
    container_name: mysql-eventbus
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: eventbus_db
    ports:
      - "3314:3306"
    volumes:
      - eventbus_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-psecret"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - microservice-net

  # Shared Redis for caching across all services
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - microservice-net

  # ============================================
  # Application Services
  # ============================================
  sales-service:
    build:
      context: ./sales-service
      dockerfile: Dockerfile
    container_name: sales-service
    ports:
      - "8001:8000"
    volumes:
      - ./sales-service:/var/www/html
      - sales_vendor:/var/www/html/vendor
    depends_on:
      mysql-sales:
        condition: service_healthy
      mysql-eventbus:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_NAME: SalesService
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: "base64:4f7vKCrvEEP0hgwxCwwDIeutl9qyEHT1wVYdMkz0+nw="
      DB_CONNECTION: mysql
      DB_HOST: mysql-sales
      DB_PORT: 3306
      DB_DATABASE: sales_db
      DB_USERNAME: root
      DB_PASSWORD: secret
      EVENTBUS_DB_HOST: mysql-eventbus
      EVENTBUS_DB_PORT: 3306
      EVENTBUS_DB_DATABASE: eventbus_db
      EVENTBUS_DB_USERNAME: root
      EVENTBUS_DB_PASSWORD: secret
      QUEUE_CONNECTION: database
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
    networks:
      - microservice-net

  sales-worker:
    build:
      context: ./sales-service
      dockerfile: Dockerfile
    container_name: sales-worker
    restart: on-failure
    command: php artisan queue:work eventbus --queue=sales --sleep=3 --tries=3
    volumes:
      - ./sales-service:/var/www/html
      - sales_vendor:/var/www/html/vendor
    depends_on:
      mysql-sales:
        condition: service_healthy
      mysql-eventbus:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_NAME: SalesService
      APP_ENV: local
