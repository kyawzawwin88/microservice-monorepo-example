      EVENTBUS_DB_PORT: 3306
      EVENTBUS_DB_DATABASE: eventbus_db
      EVENTBUS_DB_USERNAME: root
      EVENTBUS_DB_PASSWORD: secret
      QUEUE_CONNECTION: database
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      REDIS_HOST: redis
